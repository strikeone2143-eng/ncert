<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NCERT PDF Downloader</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    select, button { padding: 8px; margin: 8px 0; }
    button { cursor: pointer; }
  </style>
</head>
<body>

  <h2>NCERT PDF Downloader</h2>

  <label>Class:</label>
  <select id="classSelect">
    <option value="">Select Class</option>
    <option value="class7">Class 7</option>
  </select>
  <br>

  <label>Subject:</label>
  <select id="subjectSelect" disabled>
    <option value="">Select Subject</option>
    <option value="math">Math</option>
  </select>
  <br>

  <label>Chapter:</label>
  <select id="chapterSelect" disabled>
    <option value="">Select Chapter</option>
    <option value="ch1.pdf">Chapter 1</option>
    <option value="ch2.pdf">Chapter 2</option>
    <option value="ch3.pdf">Chapter 3</option>
  </select>
  <br>

  <button id="downloadBtn" disabled>Download PDF</button>

  <script>
    const classSelect = document.getElementById("classSelect");
    const subjectSelect = document.getElementById("subjectSelect");
    const chapterSelect = document.getElementById("chapterSelect");
    const downloadBtn = document.getElementById("downloadBtn");

    classSelect.addEventListener("change", () => {
      subjectSelect.disabled = !classSelect.value;
      chapterSelect.disabled = true;
      downloadBtn.disabled = true;
    });

    subjectSelect.addEventListener("change", () => {
      chapterSelect.disabled = !subjectSelect.value;
      downloadBtn.disabled = true;
    });

    chapterSelect.addEventListener("change", () => {
      downloadBtn.disabled = !chapterSelect.value;
    });

    downloadBtn.addEventListener("click", () => {
      const cls = classSelect.value;
      const subject = subjectSelect.value;
      const chapter = chapterSelect.value;

      // Build the URL served by your local Python server
      const pdfUrl = `http://localhost:8000/${cls}/${subject}/${chapter}`;

      // Trigger download
      window.location.href = pdfUrl;
    });
  </script>

</body>
</html>
