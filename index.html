<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NCERT Textbook Selector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      background: #f4f6fb;
      color: #222;
    }
    header {
      background: #003366;
      color: #fff;
      padding: 16px 24px;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.03em;
    }
    main {
      max-width: 960px;
      margin: 24px auto;
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      color: #003366;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    select {
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid #c5c9d6;
      font-size: 14px;
      background: #fff;
    }
    select:disabled {
      background: #f0f1f6;
      color: #888;
    }
    .actions {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    button {
      border: none;
      border-radius: 4px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary {
      background: #0066cc;
      color: #fff;
    }
    .btn-primary:disabled {
      background: #9bbce5;
      cursor: not-allowed;
    }
    .note {
      font-size: 13px;
      color: #555;
    }
    .status {
      margin-top: 16px;
      font-size: 14px;
      min-height: 18px;
    }
    .status--error {
      color: #b00020;
    }
    .status--ok {
      color: #006400;
    }
    footer {
      text-align: center;
      font-size: 12px;
      color: #777;
      padding: 16px 0 24px;
    }
  </style>
</head>
<body>
  <header>
    <h1>NCERT Textbook Access (Demo UI)</h1>
  </header>

  <main>
    <h2>Select Class, Subject, Book and Chapter</h2>

    <div class="grid">
      <div class="field">
        <label for="classSelect">Class</label>
        <select id="classSelect">
          <option value="">-- Select Class --</option>
          <option value="6">Class 6</option>
          <option value="7">Class 7</option>
          <option value="8">Class 8</option>
          <option value="9">Class 9</option>
          <option value="10">Class 10</option>
          <option value="11">Class 11</option>
          <option value="12">Class 12</option>
        </select>
      </div>

      <div class="field">
        <label for="subjectSelect">Subject</label>
        <select id="subjectSelect" disabled>
          <option value="">-- Select Subject --</option>
        </select>
      </div>

      <div class="field">
        <label for="bookSelect">Book</label>
        <select id="bookSelect" disabled>
          <option value="">-- Select Book --</option>
        </select>
      </div>

      <div class="field">
        <label for="chapterSelect">Chapter</label>
        <select id="chapterSelect" disabled>
          <option value="">-- Select Chapter --</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="downloadBtn" class="btn-primary" disabled>
        Download PDF
      </button>
      <span class="note">
        This is a demo UI. Actual NCERT PDF fetching must go via your backend/proxy.
      </span>
    </div>

    <div id="status" class="status"></div>
  </main>

  <footer>
    Demo interface inspired by NCERT textbook selection flow (no code copied).
  </footer>

  <script>
    // --- Mock data (you can replace this with real data from your backend) ---
    const DATA = {
      "6": {
        subjects: {
          "maths": {
            label: "Mathematics",
            books: {
              "maths_book": {
                label: "Maths Textbook",
                chapters: [
                  { id: "ch1", label: "Chapter 1 – Knowing Our Numbers" },
                  { id: "ch2", label: "Chapter 2 – Whole Numbers" },
                  { id: "ch3", label: "Chapter 3 – Playing with Numbers" }
                ]
              }
            }
          },
          "science": {
            label: "Science",
            books: {
              "science_book": {
                label: "Science Textbook",
                chapters: [
                  { id: "ch1", label: "Chapter 1 – Food: Where Does It Come From?" },
                  { id: "ch2", label: "Chapter 2 – Components of Food" }
                ]
              }
            }
          }
        }
      },
      "10": {
        subjects: {
          "maths": {
            label: "Mathematics",
            books: {
              "maths_main": {
                label: "Mathematics",
                chapters: [
                  { id: "ch1", label: "Chapter 1 – Real Numbers" },
                  { id: "ch2", label: "Chapter 2 – Polynomials" }
                ]
              }
            }
          },
          "science": {
            label: "Science",
            books: {
              "science_main": {
                label: "Science",
                chapters: [
                  { id: "ch1", label: "Chapter 1 – Chemical Reactions and Equations" },
                  { id: "ch2", label: "Chapter 2 – Acids, Bases and Salts" }
                ]
              }
            }
          }
        }
      }
    };

    const classSelect = document.getElementById("classSelect");
    const subjectSelect = document.getElementById("subjectSelect");
    const bookSelect = document.getElementById("bookSelect");
    const chapterSelect = document.getElementById("chapterSelect");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusEl = document.getElementById("status");

    function resetSelect(selectEl, placeholder, disable = true) {
      selectEl.innerHTML = "";
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = placeholder;
      selectEl.appendChild(opt);
      selectEl.disabled = disable;
    }

    function setStatus(message, type = "") {
      statusEl.textContent = message || "";
      statusEl.className = "status" + (type ? " status--" + type : "");
    }

    classSelect.addEventListener("change", () => {
      const cls = classSelect.value;
      resetSelect(subjectSelect, "-- Select Subject --");
      resetSelect(bookSelect, "-- Select Book --");
      resetSelect(chapterSelect, "-- Select Chapter --");
      downloadBtn.disabled = true;
      setStatus("");

      if (!cls || !DATA[cls]) {
        subjectSelect.disabled = true;
        return;
      }

      const subjects = DATA[cls].subjects;
      Object.entries(subjects).forEach(([key, value]) => {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = value.label;
        subjectSelect.appendChild(opt);
      });
      subjectSelect.disabled = false;
    });

    subjectSelect.addEventListener("change", () => {
      const cls = classSelect.value;
      const subjKey = subjectSelect.value;
      resetSelect(bookSelect, "-- Select Book --");
      resetSelect(chapterSelect, "-- Select Chapter --");
      downloadBtn.disabled = true;
      setStatus("");

      if (!cls || !subjKey || !DATA[cls]?.subjects[subjKey]) {
        bookSelect.disabled = true;
        return;
      }

      const books = DATA[cls].subjects[subjKey].books;
      Object.entries(books).forEach(([key, value]) => {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = value.label;
        bookSelect.appendChild(opt);
      });
      bookSelect.disabled = false;
    });

    bookSelect.addEventListener("change", () => {
      const cls = classSelect.value;
      const subjKey = subjectSelect.value;
      const bookKey = bookSelect.value;
      resetSelect(chapterSelect, "-- Select Chapter --");
      downloadBtn.disabled = true;
      setStatus("");

      if (!cls || !subjKey || !bookKey || !DATA[cls]?.subjects[subjKey]?.books[bookKey]) {
        chapterSelect.disabled = true;
        return;
      }

      const chapters = DATA[cls].subjects[subjKey].books[bookKey].chapters;
      chapters.forEach(ch => {
        const opt = document.createElement("option");
        opt.value = ch.id;
        opt.textContent = ch.label;
        chapterSelect.appendChild(opt);
      });
      chapterSelect.disabled = false;
    });

    chapterSelect.addEventListener("change", () => {
      downloadBtn.disabled = !chapterSelect.value;
      setStatus("");
    });

    downloadBtn.addEventListener("click", () => {
      const cls = classSelect.value;
      const subjKey = subjectSelect.value;
      const bookKey = bookSelect.value;
      const chapterId = chapterSelect.value;

      if (!cls || !subjKey || !bookKey || !chapterId) {
        setStatus("Please select all fields before downloading.", "error");
        return;
      }

      // Here you would call YOUR backend proxy, not NCERT directly.
      // Example:
      // const url = `/api/ncert?class=${cls}&subject=${subjKey}&book=${bookKey}&chapter=${chapterId}`;
      // window.location.href = url;

      setStatus(
        `Would call backend for Class ${cls}, Subject ${subjKey}, Book ${bookKey}, Chapter ${chapterId}.`,
        "ok"
      );
    });
  </script>
</body>
</html>
